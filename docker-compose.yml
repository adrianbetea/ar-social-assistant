version: "3.9"

services:
  libretranslate:
    image: libretranslate/libretranslate
    container_name: libretranslate
    ports:
      - "5000:5000"
    restart: unless-stopped

  whisper:
    build: ./backend/whisper-server
    container_name: whisper-server
    ports:
      - "5001:5001"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_PORT=5001
    restart: unless-stopped
